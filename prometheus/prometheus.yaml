global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prom-demo"
    static_configs:
      - targets: ["app:8080"]
        labels:
          env: "production"
          region: "us-central1"
          host_name: "prom-demo-host-01"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otelcol"
    static_configs:
      - targets: ["otelcol:8888"]

# No remote_write here — Prometheus scrapes only.
# The OTel Collector scrapes the app directly and handles
# normalization and export to Elasticsearch.
