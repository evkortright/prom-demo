# =============================================================================
# prom-demo OTel Collector Configuration — v1.0
#
# Transforms raw Prometheus metrics to OTel semantic conventions before
# indexing into Elasticsearch. Produces metrics-*.otel-* data streams
# with proper OTel field structure, separate from raw PRW data.
#
# Pipeline:
#   prometheus receiver (scrape /metrics)
#     → memory_limiter
#     → resource_detection (adds host.name, os.type automatically)
#     → transform/resource_promotion (lifts static labels to resource level)
#     → transform/universal (job → service.name, instance → service.instance.id)
#     → transform/http (HTTP domain label normalization)
#     → transform/grpc (gRPC domain label normalization)
#     → transform/database (DB domain label normalization)
#     → transform/metric_names (Prometheus name → OTel semconv name)
#     → batch
#     → elasticsearch exporter (otel mapping mode)
# =============================================================================

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: "prom-demo"
          scrape_interval: 15s
          static_configs:
            - targets: ["app:8080"]
              labels:
                env: "production"
                region: "us-central1"
                host_name: "prom-demo-host-01"

        - job_name: "node-exporter"
          scrape_interval: 15s
          static_configs:
            - targets: ["host.docker.internal:9100"]
              labels:
                env: "production"
                region: "us-central1"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

  batch:
    timeout: 10s
    send_batch_size: 1000

  # ---------------------------------------------------------------------------
  # Histogram temporality conversion
  #
  # The Prometheus receiver emits histograms with cumulative temporality.
  # The Elasticsearch exporter in otel mapping mode only accepts delta
  # temporality histograms — cumulative ones are silently dropped with a
  # validation warning. This processor converts them before export.
  #
  # Scoped by regexp to the three histogram metrics in this pipeline.
  # Must run before transform/metric_names so the original Prometheus
  # names are still in place for matching.
  #
  # max_staleness: 2× scrape interval (15s) to handle missed scrapes cleanly.
  # ---------------------------------------------------------------------------
  cumulative_to_delta:
    max_staleness: 30s

  # Automatically detect and add host-level resource attributes.
  # Adds: host.name (container ID), os.type, os.description, etc.
  resource_detection:
    detectors: [env, system]
    timeout: 5s
    override: false

  # ---------------------------------------------------------------------------
  # FIX: Promote static scrape labels to resource attributes.
  #
  # The Prometheus receiver puts static_config labels (env, region, host_name)
  # on datapoints, not on the resource. This processor lifts them to resource
  # level where they belong as OTel resource attributes, then removes them
  # from the datapoint to avoid duplication.
  # ---------------------------------------------------------------------------
  transform/resource_promotion:
    metric_statements:
      - context: datapoint
        statements:
          # Promote env → resource, remove from datapoint
          - set(resource.attributes["deployment.environment.name"], attributes["env"])
            where attributes["env"] != nil
          - delete_key(attributes, "env")

          # Promote region → resource, remove from datapoint
          - set(resource.attributes["cloud.region"], attributes["region"])
            where attributes["region"] != nil
          - delete_key(attributes, "region")

          # Promote host_name → resource as host.name.scrape, remove from datapoint
          - set(resource.attributes["host.name.scrape"], attributes["host_name"])
            where attributes["host_name"] != nil
          - delete_key(attributes, "host_name")

  # ---------------------------------------------------------------------------
  # LAYER 2 — Universal resource attribute normalization
  #
  # job and instance are set on the resource by the Prometheus receiver.
  # We copy them to their OTel semconv equivalents.
  # ---------------------------------------------------------------------------
  transform/universal:
    metric_statements:
      - context: resource
        statements:
          - set(attributes["service.name"], attributes["job"])
            where attributes["job"] != nil
          - set(attributes["service.instance.id"], attributes["instance"])
            where attributes["instance"] != nil

  # ---------------------------------------------------------------------------
  # LAYER 2 — HTTP domain label normalization
  # ---------------------------------------------------------------------------
  transform/http:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["http.request.method"], attributes["method"])
            where attributes["method"] != nil
          - set(attributes["url.path"], attributes["path"])
            where attributes["path"] != nil
          - set(attributes["http.response.status_code"], Int(attributes["status_code"]))
            where attributes["status_code"] != nil

  # ---------------------------------------------------------------------------
  # LAYER 2 — gRPC domain label normalization
  # ---------------------------------------------------------------------------
  transform/grpc:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["rpc.service"], attributes["grpc_service"])
            where attributes["grpc_service"] != nil
          - set(attributes["rpc.method"], attributes["grpc_method"])
            where attributes["grpc_method"] != nil
          - set(attributes["rpc.grpc.status_code"], attributes["grpc_code"])
            where attributes["grpc_code"] != nil
          - set(attributes["rpc.grpc.stream_type"], attributes["grpc_type"])
            where attributes["grpc_type"] != nil

  # ---------------------------------------------------------------------------
  # LAYER 2 — Database domain label normalization
  # ---------------------------------------------------------------------------
  transform/database:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["db.system.name"], attributes["db_system"])
            where attributes["db_system"] != nil
          - set(attributes["db.namespace"], attributes["db_name"])
            where attributes["db_name"] != nil
          - set(attributes["db.operation.name"], attributes["db_operation"])
            where attributes["db_operation"] != nil

  # ---------------------------------------------------------------------------
  # LAYER 2 — Node Exporter label normalization
  #
  # Maps Node Exporter Prometheus label names to OTel system.* semconv.
  # Only runs on node-exporter metrics (scoped by job label already on resource).
  # Original labels preserved alongside OTel attributes for backward compat.
  # ---------------------------------------------------------------------------
  transform/node:
    metric_statements:
      - context: datapoint
        statements:
          # CPU: cpu → system.cpu.logical_number, mode → system.cpu.state
          - set(attributes["system.cpu.logical_number"], attributes["cpu"])
            where attributes["cpu"] != nil
          - set(attributes["system.cpu.state"], attributes["mode"])
            where attributes["mode"] != nil and resource.attributes["service.name"] == "node-exporter"

          # Filesystem: mountpoint → system.filesystem.mountpoint, fstype → system.filesystem.type
          - set(attributes["system.filesystem.mountpoint"], attributes["mountpoint"])
            where attributes["mountpoint"] != nil
          - set(attributes["system.filesystem.type"], attributes["fstype"])
            where attributes["fstype"] != nil

          # Disk: device → system.device
          - set(attributes["system.device"], attributes["device"])
            where attributes["device"] != nil and resource.attributes["service.name"] == "node-exporter"

          # Network: device → system.device (same attribute, same mapping)
          # (already covered by system.device above)

  # ---------------------------------------------------------------------------
  # LAYER 1 — Metric name normalization
  #
  # Renames Prometheus metric names to OTel semantic convention equivalents.
  # Unmapped metrics pass through unchanged — safe for any Prometheus source.
  # ---------------------------------------------------------------------------
  transform/metric_names:
    metric_statements:
      - context: metric
        statements:
          # HTTP
          - set(metric.name, "http.server.request.count")
            where metric.name == "http_requests_total"
          - set(metric.name, "http.server.request.duration")
            where metric.name == "http_request_duration_seconds"

          # gRPC
          - set(metric.name, "rpc.server.request.count")
            where metric.name == "grpc_server_handled_total"
          - set(metric.name, "rpc.server.duration")
            where metric.name == "grpc_server_handling_seconds"

          # Database
          - set(metric.name, "db.client.operation.duration")
            where metric.name == "db_query_duration_seconds"
          - set(metric.name, "db.client.connection.count")
            where metric.name == "db_connections_active"
          - set(metric.name, "db.client.operation.errors")
            where metric.name == "db_errors_total"

          # Go runtime
          #
          # Source: Prometheus client_golang GoCollector (runtime.MemStats).
          # Target: OTel Go semconv where a clear equivalent exists.
          #
          # MAPPED — unambiguous OTel semconv equivalents:
          - set(metric.name, "go.goroutine.count")
            where metric.name == "go_goroutines"
          - set(metric.name, "go.processor.limit")
            where metric.name == "go_threads"
          - set(metric.name, "go.memory.heap.used")
            where metric.name == "go_memstats_heap_inuse_bytes"
          - set(metric.name, "go.memory.heap.idle")
            where metric.name == "go_memstats_heap_idle_bytes"
          - set(metric.name, "go.memory.heap.released")
            where metric.name == "go_memstats_heap_released_bytes"
          - set(metric.name, "go.memory.heap.objects")
            where metric.name == "go_memstats_heap_objects"
          - set(metric.name, "go.memory.heap.alloc")
            where metric.name == "go_memstats_alloc_bytes"
          - set(metric.name, "go.memory.heap.sys")
            where metric.name == "go_memstats_heap_sys_bytes"
          - set(metric.name, "go.memory.stack.used")
            where metric.name == "go_memstats_stack_inuse_bytes"
          - set(metric.name, "go.memory.stack.system")
            where metric.name == "go_memstats_stack_sys_bytes"
          - set(metric.name, "go.memory.system")
            where metric.name == "go_memstats_sys_bytes"
          - set(metric.name, "go.memory.allocated")
            where metric.name == "go_memstats_alloc_bytes_total"
          - set(metric.name, "go.memory.allocations")
            where metric.name == "go_memstats_mallocs_total"
          - set(metric.name, "go.memory.frees")
            where metric.name == "go_memstats_frees_total"
          - set(metric.name, "go.memory.gc.goal")
            where metric.name == "go_memstats_next_gc_bytes"
          - set(metric.name, "go.memory.gc.overhead")
            where metric.name == "go_memstats_gc_sys_bytes"
          - set(metric.name, "go.memory.gc.last_collection")
            where metric.name == "go_memstats_last_gc_time_seconds"
          - set(metric.name, "go.memory.gc.pause")
            where metric.name == "go_gc_duration_seconds"

          # Node Exporter — system.* semconv
          # CPU
          - set(metric.name, "system.cpu.time")
            where metric.name == "node_cpu_seconds_total"

          # Memory
          - set(metric.name, "system.memory.limit")
            where metric.name == "node_memory_total_bytes"
          - set(metric.name, "system.memory.usage")
            where metric.name == "node_memory_active_bytes"
          - set(metric.name, "system.memory.free")
            where metric.name == "node_memory_free_bytes"
          - set(metric.name, "system.memory.inactive")
            where metric.name == "node_memory_inactive_bytes"
          - set(metric.name, "system.paging.limit")
            where metric.name == "node_memory_swap_total_bytes"
          - set(metric.name, "system.paging.usage")
            where metric.name == "node_memory_swap_used_bytes"
          - set(metric.name, "system.paging.operations.page_in")
            where metric.name == "node_memory_swapped_in_bytes_total"
          - set(metric.name, "system.paging.operations.page_out")
            where metric.name == "node_memory_swapped_out_bytes_total"

          # Filesystem
          - set(metric.name, "system.filesystem.capacity")
            where metric.name == "node_filesystem_size_bytes"
          - set(metric.name, "system.filesystem.available")
            where metric.name == "node_filesystem_avail_bytes"
          - set(metric.name, "system.filesystem.free")
            where metric.name == "node_filesystem_free_bytes"
          - set(metric.name, "system.filesystem.inodes")
            where metric.name == "node_filesystem_files"
          - set(metric.name, "system.filesystem.inodes.free")
            where metric.name == "node_filesystem_files_free"

          # Disk I/O
          - set(metric.name, "system.disk.io.read")
            where metric.name == "node_disk_read_bytes_total"
          - set(metric.name, "system.disk.io.write")
            where metric.name == "node_disk_written_bytes_total"
          - set(metric.name, "system.disk.operations.read")
            where metric.name == "node_disk_reads_completed_total"
          - set(metric.name, "system.disk.operations.write")
            where metric.name == "node_disk_writes_completed_total"
          - set(metric.name, "system.disk.io_time.read")
            where metric.name == "node_disk_read_time_seconds_total"
          - set(metric.name, "system.disk.io_time.write")
            where metric.name == "node_disk_write_time_seconds_total"

          # Network
          - set(metric.name, "system.network.io.receive")
            where metric.name == "node_network_receive_bytes_total"
          - set(metric.name, "system.network.io.transmit")
            where metric.name == "node_network_transmit_bytes_total"
          - set(metric.name, "system.network.packets.receive")
            where metric.name == "node_network_receive_packets_total"
          - set(metric.name, "system.network.packets.transmit")
            where metric.name == "node_network_transmit_packets_total"
          - set(metric.name, "system.network.errors.receive")
            where metric.name == "node_network_receive_errs_total"
          - set(metric.name, "system.network.errors.transmit")
            where metric.name == "node_network_transmit_errs_total"
          - set(metric.name, "system.network.dropped.receive")
            where metric.name == "node_network_receive_drop_total"

          # Load average
          - set(metric.name, "system.cpu.load_average.1m")
            where metric.name == "node_load1"
          - set(metric.name, "system.cpu.load_average.5m")
            where metric.name == "node_load5"
          - set(metric.name, "system.cpu.load_average.15m")
            where metric.name == "node_load15"

          # PASSTHROUGH — no unambiguous OTel semconv equivalent.
          # Pass through with original Prometheus names. Queryable but excluded
          # from OTel-normalized dashboards. Conversion tool flags these for
          # manual review.
          #   go_memstats_mspan_inuse_bytes   — internal allocator structures
          #   go_memstats_mspan_sys_bytes     — internal allocator structures
          #   go_memstats_mcache_inuse_bytes  — internal allocator structures
          #   go_memstats_mcache_sys_bytes    — internal allocator structures
          #   go_memstats_buck_hash_sys_bytes — profiling bucket overhead
          #   go_memstats_other_sys_bytes     — catch-all system memory
          #   go_info                         — label-only info metric

          # Process (standard across all Go apps)
          - set(metric.name, "process.cpu.time")
            where metric.name == "process_cpu_seconds_total"
          - set(metric.name, "process.memory.usage")
            where metric.name == "process_resident_memory_bytes"
          - set(metric.name, "process.memory.virtual")
            where metric.name == "process_virtual_memory_bytes"
          - set(metric.name, "process.open_file_descriptors")
            where metric.name == "process_open_fds"
          - set(metric.name, "process.start_time")
            where metric.name == "process_start_time_seconds"

exporters:
  elasticsearch:
    endpoints:
      - ${ES_ENDPOINT}
    api_key: ${ES_API_KEY}
    mapping:
      mode: otel
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
    timeout: 30s

  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors:
        - memory_limiter
        - cumulative_to_delta
        - resource_detection
        - transform/resource_promotion
        - transform/universal
        - transform/http
        - transform/grpc
        - transform/database
        - transform/node
        - transform/metric_names
        - batch
      exporters: [elasticsearch, debug]

  telemetry:
    logs:
      level: info
